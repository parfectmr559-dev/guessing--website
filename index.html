<!DOCTYPE html>
<html>
<head>

<title>Smart Guessing</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
background:#000;
color:white;
font-family:Arial;
margin:0;
padding:20px;
text-align:center;
}

h1{
color:red;
font-size:50px;
margin-top:30px;
}

.box{
background:#1b1b1b;
padding:25px;
border-radius:15px;
margin-top:30px;
}

select,input,button{
width:90%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:20px;
}

select,input{
background:white;
color:black;
}

button{
background:red;
color:white;
font-weight:bold;
}

#result{
margin-top:30px;
font-size:25px;
color:yellow;
font-weight:bold;
line-height:45px;
}

.footer{
margin-top:50px;
color:#777;
font-size:18px;
}

</style>

</head>

<body>

<h1>SMART GUESSING</h1>

<div class="box">

<select id="market">

<option>Shredevi Day</option>
<option>Time Bazar</option>
<option>Madhur Day</option>
<option>Milan Day</option>
<option>Rajdhani Day</option>
<option>Supreme Day</option>
<option>Kalyan</option>

<option>Shredevi Night</option>
<option>Madhur Night</option>
<option>Supreme Night</option>
<option>Milan Night</option>
<option>Kalyan Night</option>
<option>Rajdhani Night</option>
<option>Main Bazar</option>

</select>

<input type="text"
id="record"
placeholder="Enter Old Record">

<button onclick="showGuess()">
SHOW GUESS
</button>

<div id="result"></div>

</div>

<div class="footer">
Smart Guessing Website
</div>

<script>

function showGuess(){

let market =
document.getElementById("market").value;

let record =
document.getElementById("record").value;

if(record==""){

document.getElementById("result").innerHTML =
"Record Dalo";

return;

}

let jodi = [
"12","14","24","46",
"69","78","89","17",
"29","56","33","44",
"55","66","77","88"
];

let a =
jodi[Math.floor(Math.random()*jodi.length)];

let b =
jodi[Math.floor(Math.random()*jodi.length)];

let c =
jodi[Math.floor(Math.random()*jodi.length)];

document.getElementById("result").innerHTML =

market +

"<br><br>" +

"Old Record : " + record +

"<br><br>" +

"Jodi Guess" +

"<br><br>" +

a + " - " + b + " - " + c +

"<br><br>" +

"Open Ank : 1 4 7 9" +

"<br>" +

"Close Ank : 2 5 6 8" +

"<br><br>" +

"Panel : 128 470 569";

}

</script>

</body>
</html>
